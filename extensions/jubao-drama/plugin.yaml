name: jubao-drama
version: 0.1.0
description: 按需选择完整创作 Agent，叠加大纲扩写、去 AI 味和剧本评估；内部模块按任务加载，支持分批创作、稿件交付和表格读取。
author: "田易昂"
python_dependencies:
  - "xlrd>=2.0.2,<3"
provides_tools:
  - drama_project_create
  - drama_project_status
  - drama_material_import
  - drama_submit
  - drama_confirm
  - drama_review
  - drama_export
  - drama_rules_read
  - drama_agent_document
  - drama_story_bible
  - drama_requirements
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - transform_llm_output
  - post_approval_response
  - on_session_start
  - on_session_end
  - subagent_stop
provides_middleware:
  - tool_execution
  - llm_request
